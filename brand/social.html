<!doctype html>
<!-- The 1200x630 card shown when a link to the site or repo is shared. Rendered to
     docs/images/social.jpg by tools/brand-images.py; upload the same file as the repo's
     social preview (Settings > General). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(circle at 25% 35%, #2e2309, #15110a 70%); color: #fff;
    font: 26px/1.4 system-ui, "Segoe UI", Roboto, Arial, sans-serif; position: relative; }
  .left { position: absolute; left: 70px; top: 90px; width: 500px; }
  .left img { width: 120px; height: 120px; }
  h1 { font: 92px/1 Marcellus, Georgia, serif; color: #ffd100; margin: 22px 0 14px; text-shadow: 0 2px 0 #000; }
  p { margin: 0 0 22px; color: #e8e2d0; }
  .badge { display: inline-block; color: #ffd100; font-weight: 700; font-size: 21px; padding: 6px 14px;
    background: #0d0d0d; border: 2px solid #000; box-shadow: inset 0 0 0 1px #ffd100; }
  .shot { position: absolute; right: -40px; top: 60px; width: 580px; border: 2px solid #000;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .6); }
</style>
</head>
<body>
  <div class="left">
    <img src="../docs/images/icon.svg" alt="">
    <h1>Circ</h1>
    <p>A trade ledger for your guild, friends or realm. See who makes it, who buys it and who has it.</p>
    <span class="badge">WoW Classic Era</span>
  </div>
  <img class="shot" src="../docs/images/shots/ledger.webp" alt="">
</body>
</html>
