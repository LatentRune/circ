# Posts the screenshots made by screenshots.yml on the pull request. Runs from the main
# branch's copy of this file, never the PR's, and only reads PNG files from the artifact,
# so a pull request from a fork can't run code here. The pictures are kept on the
# pr-screenshots branch so the comment can show them.
name: Screenshots comment
on:
  workflow_run:
    workflows: [Screenshots]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-shots
          path: shots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const pr = parseInt(fs.readFileSync('shots/pr-number', 'utf8').trim(), 10);
            if (!Number.isInteger(pr) || pr <= 0) throw new Error('no PR number in the artifact');
            // The artifact says which PR; make sure it really is the one this run tested.
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pr });
            if (pull.head.sha !== run.head_sha) { core.info('PR has moved on; skipping'); return; }

            // Only PNGs with plain names are taken.
            const SAFE = /^[a-z0-9][a-z0-9-]*\.png$/;
            const shots = {};
            for (const side of ['before', 'after']) {
              const dir = path.join('shots', side);
              if (!fs.existsSync(dir)) continue;
              for (const f of fs.readdirSync(dir)) {
                if (SAFE.test(f)) (shots[f.slice(0, -4)] ??= {})[side] = path.join(dir, f);
              }
            }
            const names = Object.keys(shots).filter(n => shots[n].after).sort();

            const BRANCH = 'pr-screenshots';
            const folder = `pr-${pr}/${run.id}`;
            const url = (side, n) => `https://github.com/${owner}/${repo}/blob/${BRANCH}/${folder}/${side}/${n}.png?raw=true`;
            if (names.length) {
              // One commit with every picture, on a branch of its own.
              let parent = null, baseTree;
              try {
                const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${BRANCH}` });
                parent = ref.object.sha;
                const { data: c } = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
                baseTree = c.tree.sha;
              } catch (e) { if (e.status !== 404) throw e; }
              const tree = [];
              for (const n of names) {
                for (const side of ['before', 'after']) {
                  if (!shots[n][side]) continue;
                  const { data: blob } = await github.rest.git.createBlob({ owner, repo,
                    content: fs.readFileSync(shots[n][side]).toString('base64'), encoding: 'base64' });
                  tree.push({ path: `${folder}/${side}/${n}.png`, mode: '100644', type: 'blob', sha: blob.sha });
                }
              }
              const { data: t } = await github.rest.git.createTree({ owner, repo, tree, ...(baseTree ? { base_tree: baseTree } : {}) });
              const { data: commit } = await github.rest.git.createCommit({ owner, repo,
                message: `Screenshots for #${pr}`, tree: t.sha, parents: parent ? [parent] : [] });
              if (parent) await github.rest.git.updateRef({ owner, repo, ref: `heads/${BRANCH}`, sha: commit.sha });
              else await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: commit.sha });
            }

            const MARK = '<!-- circ-screenshots -->';
            let body = `${MARK}\n### Screenshots\n\n`;
            if (!names.length) {
              body += 'No scenario draws differently with this change.';
            } else {
              body += '| Scenario | Before | After |\n|---|---|---|\n';
              for (const n of names) {
                const before = shots[n].before ? `<img src="${url('before', n)}" width="360">` : '(new scenario)';
                body += `| \`${n}\` | ${before} | <img src="${url('after', n)}" width="360"> |\n`;
              }
              body += `\nDrawn from this PR's code by tools/pr-shots.py (commit ${run.head_sha.slice(0, 7)}).`;
            }
            body += '\n\n---\n_Generated by the Screenshots workflow_';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.startsWith(MARK));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
